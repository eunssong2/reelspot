services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atp
      POSTGRES_PASSWORD: atp-local-only
      POSTGRES_DB: atp
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["atp-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atp"]
      interval: 3s
      retries: 20
  worker:
    build: .
    profiles: ["worker"]
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://atp:atp-local-only@db:5432/atp
      OBJECT_ROOT: /app/.data/objects
    volumes: ["./.data:/app/.data"]
    depends_on:
      db: {condition: service_healthy}
    cpus: 2
    mem_limit: 2g
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  atp-db:
