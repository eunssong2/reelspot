services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atp
      POSTGRES_PASSWORD: atp-local-only
      POSTGRES_DB: atp
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["atp-db:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atp"]
      interval: 3s
      retries: 20
  api:
    image: samsun-server:local
    profiles: ["app"]
    command: ["node", "--import", "tsx", "server/api/main.ts"]
    env_file: .env
    # Linux host networking keeps Nginx -> API on loopback; no public 8081 listener.
    network_mode: host
    environment:
      NODE_ENV: production
      AUTH_MODE: provider
      OPS_MODE: oidc
      MODERATION_MODE: review
      HOST: 127.0.0.1
      PORT: 8081
      DATABASE_URL: postgres://atp:atp-local-only@127.0.0.1:55432/atp
      OBJECT_ROOT: /app/.data/objects
    volumes: ["./.data/objects:/app/.data/objects"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    image: samsun-server:local
    profiles: ["worker", "app"]
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      NODE_ENV: production
      AUTH_MODE: provider
      OPS_MODE: oidc
      MODERATION_MODE: review
      DATABASE_URL: postgres://atp:atp-local-only@db:5432/atp
      OBJECT_ROOT: /app/.data/objects
    volumes: ["./.data/objects:/app/.data/objects"]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    cpus: 2
    mem_limit: 2g
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  atp-db:
