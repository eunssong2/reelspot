# Include INSIDE the existing TLS server block for sphan0325.ddns.net.
# Keep the existing /guacamole/ location and certificate configuration.
# The only HTTP hop is loopback inside this server; the app uses HTTPS exclusively.
location ^~ /v1/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 4m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 120s;
    # Do not log OAuth callback codes/state or invitation tokens from URLs.
    access_log off;
}
location ^~ /documents/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /health {
    proxy_pass http://127.0.0.1:8081;
}
location = /invite {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    access_log off;
}
location = /.well-known/assetlinks.json {
    proxy_pass http://127.0.0.1:8081;
}
