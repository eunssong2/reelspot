<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><style>text{font-family:"Noto Sans CJK KR",sans-serif}</style><rect x="0" y="0" width="390" height="844" rx="26" fill="#FFFFFF"/><text x="20" y="24" fill="#5F6B78" font-size="12" font-weight="500" text-anchor="start"><tspan x="20" dy="0">9:41   ·   Android</tspan></text><text x="20" y="71" fill="#191F28" font-size="23" font-weight="700" text-anchor="start"><tspan x="20" dy="0">‹  오류와 변경 결과 확인</tspan></text><text x="20" y="136" fill="#191F28" font-size="24" font-weight="700" text-anchor="start"><tspan x="20" dy="0">① 저장 결과를 확인 중이에요</tspan></text><text x="20" y="208" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">요청은 접수됐을 수 있어요.</tspan><tspan x="20" dy="19.599999999999998">내용을 다시 만들지 않고 확인할게요.</tspan></text><rect x="20" y="250" width="350" height="56" rx="12" fill="#FFFFFF" stroke="#DCE1E6"/><text x="195.0" y="282.8" fill="#B8433F" font-size="16" font-weight="700" text-anchor="middle"><tspan x="195.0" dy="0">② 같은 요청 결과 확인</tspan></text><rect x="20" y="316" width="350" height="82" rx="12" fill="#F2F4F6"/><text x="34" y="350.6" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">③ 다른 사람이 먼저 수정했어요.</tspan><tspan x="34" dy="22.4">내 입력을 유지했어요. 최신 내용 확인 &gt;</tspan></text><rect x="20" y="408" width="350" height="56" rx="12" fill="#FFFFFF" stroke="#DCE1E6"/><text x="195.0" y="440.8" fill="#B8433F" font-size="16" font-weight="700" text-anchor="middle"><tspan x="195.0" dy="0">최신 내용에 다시 적용</tspan></text><text x="20" y="488" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">④ 문의용 번호 REQ-2026-…</tspan></text><text x="20" y="544" fill="#B8433F" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">문의하기</tspan></text><rect x="143" y="826" width="104" height="4" rx="2" fill="#191F28"/></svg>