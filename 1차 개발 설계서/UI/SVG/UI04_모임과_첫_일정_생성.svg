<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><style>text{font-family:"Noto Sans CJK KR",sans-serif}</style><rect x="0" y="0" width="390" height="844" rx="26" fill="#FFFFFF"/><text x="20" y="24" fill="#5F6B78" font-size="12" font-weight="500" text-anchor="start"><tspan x="20" dy="0">9:41   ·   Android</tspan></text><text x="20" y="71" fill="#191F28" font-size="23" font-weight="700" text-anchor="start"><tspan x="20" dy="0">‹  모임과 첫 일정 생성</tspan></text><text x="20" y="136" fill="#191F28" font-size="24" font-weight="700" text-anchor="start"><tspan x="20" dy="0">새 모임 만들기</tspan></text><text x="20" y="208" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">🎉 함께할 순간을 시작해볼까요?</tspan><tspan x="20" dy="19.599999999999998">모임을 열고 첫 일정을 가볍게 등록해보세요.</tspan></text><rect x="20" y="250" width="350" height="64" rx="12" fill="#F2F4F6"/><text x="34" y="275.6" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">① 모임 이름 *  어떤 이름이든 좋아요 </tspan><tspan x="34" dy="22.4">|  예: 주말 산책 모임   0/50</tspan></text><rect x="20" y="324" width="350" height="64" rx="12" fill="#F2F4F6"/><text x="34" y="343" fill="#191F28" font-size="14" font-weight="500" text-anchor="start"><tspan x="34" dy="0">② 첫 일정 제목 *  언제든 바꿀 수</tspan><tspan x="34" dy="19.599999999999998">있어요  |  예: 우리의 서울 여행  </tspan><tspan x="34" dy="19.599999999999998">0/100</tspan></text><rect x="20" y="398" width="350" height="64" rx="12" fill="#F2F4F6"/><text x="34" y="423.6" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">③ 일정 기간 *  시작 날짜  —  종료</tspan><tspan x="34" dy="22.4">날짜   📅 3일 동안</tspan></text><text x="20" y="486" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">ℹ️ 시간은 장소를 추가할 때 입력해요. 반복</tspan><tspan x="20" dy="19.599999999999998">설정은 없어요. 필요하면 일정을 더 추가해요.</tspan></text><text x="20" y="542" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">👥 한국 시간 기준 · 최대 15명 고정 ·</tspan><tspan x="20" dy="19.599999999999998">정원 변경 없음</tspan></text><rect x="20" y="584" width="350" height="56" rx="12" fill="#B8433F"/><text x="195.0" y="616.8" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle"><tspan x="195.0" dy="0">④ 모임과 첫 일정 만들기  →</tspan></text><rect x="143" y="826" width="104" height="4" rx="2" fill="#191F28"/></svg>