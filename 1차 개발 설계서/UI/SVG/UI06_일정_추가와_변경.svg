<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><style>text{font-family:"Noto Sans CJK KR",sans-serif}</style><rect x="0" y="0" width="390" height="844" rx="26" fill="#FFFFFF"/><text x="20" y="24" fill="#5F6B78" font-size="12" font-weight="500" text-anchor="start"><tspan x="20" dy="0">9:41   ·   Android</tspan></text><text x="20" y="71" fill="#191F28" font-size="23" font-weight="700" text-anchor="start"><tspan x="20" dy="0">‹  일정 추가와 변경</tspan></text><rect x="20" y="112" width="350" height="64" rx="12" fill="#F2F4F6"/><text x="34" y="148.8" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">① 제목  |  우리의 서울 여행</tspan></text><rect x="20" y="186" width="350" height="64" rx="12" fill="#F2F4F6"/><text x="34" y="211.6" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">② 시작 2026.10.17  /  종료</tspan><tspan x="34" dy="22.4">2026.10.19</tspan></text><text x="20" y="274" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">시간은 각 장소에서 입력해요 · 반복 없음</tspan></text><rect x="20" y="316" width="350" height="64" rx="12" fill="#FDEDEB"/><text x="34" y="341.6" fill="#B8433F" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">최초 기록 완료 후 보관 기한은 바뀌지</tspan><tspan x="34" dy="22.4">않아요</tspan></text><rect x="20" y="390" width="350" height="82" rx="12" fill="#F2F4F6"/><text x="34" y="415.6" fill="#191F28" font-size="14" font-weight="500" text-anchor="start"><tspan x="34" dy="0">③ 기간을 줄이면 기간 밖이 되는 기록 2개</tspan><tspan x="34" dy="19.599999999999998">· 방문 1개</tspan><tspan x="34" dy="19.599999999999998">삭제되지 않고 기간 밖 구역에 남아요</tspan></text><rect x="20" y="482" width="350" height="56" rx="12" fill="#B8433F"/><text x="195.0" y="514.8" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle"><tspan x="195.0" dy="0">저장</tspan></text><text x="20" y="562" fill="#B8433F" font-size="14" font-weight="500" text-anc