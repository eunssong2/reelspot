<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><style>text{font-family:"Noto Sans CJK KR",sans-serif}</style><rect x="0" y="0" width="390" height="844" rx="26" fill="#FFFFFF"/><text x="20" y="24" fill="#5F6B78" font-size="12" font-weight="500" text-anchor="start"><tspan x="20" dy="0">9:41   ·   Android</tspan></text><text x="20" y="71" fill="#191F28" font-size="23" font-weight="700" text-anchor="start"><tspan x="20" dy="0">‹  모임 나가기와 종료</tspan></text><text x="20" y="136" fill="#191F28" font-size="24" font-weight="700" text-anchor="start"><tspan x="20" dy="0">① 모임을 나가시겠어요?</tspan></text><rect x="20" y="194" width="350" height="82" rx="12" fill="#F2F4F6"/><text x="34" y="219.6" fill="#191F28" font-size="14" font-weight="500" text-anchor="start"><tspan x="34" dy="0">올린 기록은 표시된 기한까지 유지돼요.</tspan><tspan x="34" dy="19.599999999999998">본인 기록은 나간 뒤에도 조회·삭제</tspan><tspan x="34" dy="19.599999999999998">가능해요.</tspan></text><text x="20" y="300" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">나간 뒤 새 저장·정보 수정은 불가해요.</tspan></text><rect x="20" y="342" width="350" height="56" rx="12" fill="#FFFFFF" stroke="#DCE1E6"/><text x="34" y="374.8" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">② 방장인 경우 후임 선택 &gt;</tspan></text><rect x="20" y="408" width="350" height="64" rx="12" fill="#FDEDEB"/><text x="34" y="433.6" fill="#B8433F" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">③ 혼자 남은 방장은 모임 종료와</tspan><tspan x="34" dy="22.4">본인 서버 기록 삭제를 확인해 주세요.</tspan></text><rect x="20" y="482" width="350" height="56" rx="12" fill="#B8433F"/><text x="195.0" y="514.8" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle"><tspan x="195.0" dy="0">④ 확인하고 나가기</tspan></text><rect x="20" y="548" width="350" height="56" rx="12" fill="#FFFFFF" stroke="#DCE1E6"/><text x="195.0" y="580.8" fill="#B8433F" font-size="16" font-weight="700" text-anchor="middle"><tspan x="195.0" dy="0">돌아가기</tspan></text><rect x="143" y="826" width="104" height="4" rx="2" fill="#191F28"/></svg>