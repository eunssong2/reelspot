<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><style>text{font-family:"Noto Sans CJK KR",sans-serif}</style><rect x="0" y="0" width="390" height="844" rx="26" fill="#FFFFFF"/><text x="20" y="24" fill="#5F6B78" font-size="12" font-weight="500" text-anchor="start"><tspan x="20" dy="0">9:41   ·   Android</tspan></text><text x="20" y="71" fill="#191F28" font-size="23" font-weight="700" text-anchor="start"><tspan x="20" dy="0">‹  가입 동의와 표시명</tspan></text><text x="20" y="136" fill="#191F28" font-size="24" font-weight="700" text-anchor="start"><tspan x="20" dy="0">처음 오셨네요</tspan></text><text x="20" y="208" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">문서를 읽고 필요한 항목에 동의해 주세요.</tspan></text><rect x="20" y="250" width="350" height="56" rx="12" fill="#FFFFFF" stroke="#DCE1E6"/><text x="34" y="282.8" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">① [ ] 이용약관 동의   필수  &gt;</tspan></text><rect x="20" y="316" width="350" height="56" rx="12" fill="#FFFFFF" stroke="#DCE1E6"/><text x="34" y="348.8" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">① [ ] 개인정보 안내   필수  &gt;</tspan></text><rect x="20" y="382" width="350" height="56" rx="12" fill="#FFFFFF" stroke="#DCE1E6"/><text x="34" y="414.8" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">① [ ] 선택 항목 동의  &gt;</tspan></text><rect x="20" y="448" width="350" height="64" rx="12" fill="#F2F4F6"/><text x="34" y="484.8" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">② 표시명  |  지민</tspan></text><text x="20" y="536" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">중복 표시명도 사용할 수 있어요. 최대 20자</tspan></text><rect x="20" y="578" width="350" height="56" rx="12" fill="#B8433F"/><text x="195.0" y="610.8" fill="#FFFFFF" font-size="16" font-weight="700" text-a