<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><style>text{font-family:"Noto Sans CJK KR",sans-serif}</style><rect x="0" y="0" width="390" height="844" rx="26" fill="#FFFFFF"/><text x="20" y="24" fill="#5F6B78" font-size="12" font-weight="500" text-anchor="start"><tspan x="20" dy="0">9:41   ·   Android</tspan></text><text x="20" y="71" fill="#191F28" font-size="23" font-weight="700" text-anchor="start"><tspan x="20" dy="0">‹  계정 삭제</tspan></text><text x="20" y="136" fill="#191F28" font-size="24" font-weight="700" text-anchor="start"><tspan x="20" dy="0">계정을 삭제하기 전에</tspan></text><rect x="20" y="194" width="350" height="82" rx="12" fill="#F2F4F6"/><text x="34" y="219.6" fill="#191F28" font-size="14" font-weight="500" text-anchor="start"><tspan x="34" dy="0">① 방장 역할 정리 필요 2개</tspan><tspan x="34" dy="19.599999999999998">산책 모임: 방장 이전 &gt;</tspan><tspan x="34" dy="19.599999999999998">혼자 있는 모임: 종료와 본인 기록 삭제 &gt;</tspan></text><text x="20" y="300" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">② 모든 모임의 내 서버 기록이 삭제돼요.</tspan><tspan x="20" dy="19.599999999999998">나간 모임·종료 모임도 포함해요.</tspan></text><text x="20" y="356" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">타인 기록·기기 원본·외부 사본은 유지돼요.</tspan></text><rect x="20" y="398" width="350" height="56" rx="12" fill="#FFFFFF" stroke="#DCE1E6"/><text x="34" y="430.8" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">[ ] 삭제 결과를 확인했어요</tspan></text><rect x="20" y="464" width="350" height="56" rx="12" fill="#B8433F"/><text x="195.0" y="496.8" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle"><tspan x="195.0" dy="0">③ 본인 확인 후 계정 삭제</tspan></text><rect x="143" y="826" width="104" height="4" rx="2" fill="#191F28"/></svg>