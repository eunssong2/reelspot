<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><style>text{font-family:"Noto Sans CJK KR",sans-serif}</style><rect x="0" y="0" width="390" height="844" rx="26" fill="#FFFFFF"/><text x="20" y="24" fill="#5F6B78" font-size="12" font-weight="500" text-anchor="start"><tspan x="20" dy="0">9:41   ·   Android</tspan></text><text x="20" y="71" fill="#191F28" font-size="23" font-weight="700" text-anchor="start"><tspan x="20" dy="0">‹  저장 공간과 캐시</tspan></text><text x="20" y="136" fill="#191F28" font-size="24" font-weight="700" text-anchor="start"><tspan x="20" dy="0">저장 공간</tspan></text><rect x="20" y="194" width="350" height="82" rx="12" fill="#F2F4F6"/><text x="34" y="219.6" fill="#191F28" font-size="14" font-weight="500" text-anchor="start"><tspan x="34" dy="0">① 모임 원본  1.2GB / 5GB</tspan><tspan x="34" dy="19.599999999999998">전송 예약 0.1GB · 남은 용량</tspan><tspan x="34" dy="19.599999999999998">3.7GB</tspan></text><rect x="20" y="286" width="350" height="82" rx="12" fill="#F2F4F6"/><text x="34" y="320.6" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">② 기기 재생 캐시 210MB /</tspan><tspan x="34" dy="22.4">최대500MB</tspan></text><rect x="20" y="378" width="350" height="82" rx="12" fill="#F2F4F6"/><text x="34" y="412.6" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">③ 미완료 업로드 임시 파일 80MB</tspan><tspan x="34" dy="22.4">업로드가 끝날 때까지 별도로 보관해요.</tspan></text><rect x="20" y="470" width="350" height="56" rx="12" fill="#FFFFFF" stroke="#DCE1E6"/><text x="195.0" y="502.8" fill="#B8433F" font-size="16" font-weight="700" text-anchor="middle"><tspan x="195.0" dy="0">④ 재생 캐시만 정리</tspan></text><text x="20" y="550" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">삭제한 원본은 실제 정리 완료 후 용량이</tspan><tspan x="20" dy="19.599999999999998">돌아와요.</tspan></text><rect x="143" y="826" width="104" height="4" rx="2" fill="#191F28"/></svg>