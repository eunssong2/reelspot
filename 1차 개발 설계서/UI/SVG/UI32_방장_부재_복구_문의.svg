<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><style>text{font-family:"Noto Sans CJK KR",sans-serif}</style><rect x="0" y="0" width="390" height="844" rx="26" fill="#FFFFFF"/><text x="20" y="24" fill="#5F6B78" font-size="12" font-weight="500" text-anchor="start"><tspan x="20" dy="0">9:41   ·   Android</tspan></text><text x="20" y="71" fill="#191F28" font-size="23" font-weight="700" text-anchor="start"><tspan x="20" dy="0">‹  방장 부재 복구 문의</tspan></text><text x="20" y="136" fill="#191F28" font-size="24" font-weight="700" text-anchor="start"><tspan x="20" dy="0">방장 부재 복구 요청</tspan></text><rect x="20" y="194" width="350" height="64" rx="12" fill="#F2F4F6"/><text x="34" y="230.8" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">① 부재 사유와 최소 확인 자료</tspan></text><rect x="20" y="268" width="350" height="56" rx="12" fill="#FFFFFF" stroke="#DCE1E6"/><text x="34" y="300.8" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">② 후임 후보  |  수현 &gt;</tspan></text><text x="20" y="348" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">후임의 별도 동의와 본인 확인이 필요해요.</tspan></text><rect x="20" y="390" width="350" height="64" rx="12" fill="#FDEDEB"/><text x="34" y="415.6" fill="#B8433F" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">③ 기존 방장에게 통지하고 7일간</tspan><tspan x="34" dy="22.4">응답을 기다린 뒤 담당자가 검토해요.</tspan></text><rect x="20" y="464" width="350" height="56" rx="12" fill="#B8433F"/><text x="195.0" y="496.8" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle"><tspan x="195.0" dy="0">④ 복구 검토 요청</tspan></text><rect x="20" y="530" width="350" height="82" rx="12" fill="#F2F4F6"/><text x="34" y="575.8" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">처리 상태  접수 → 확인 → 통지 → 검토</tspan></text><rect x="143" y="826" width="104" height="4" rx="2" fill="#191F28"/></svg>