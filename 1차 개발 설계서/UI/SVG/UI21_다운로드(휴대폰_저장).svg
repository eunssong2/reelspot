<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><style>text{font-family:"Noto Sans CJK KR",sans-serif}</style><rect x="0" y="0" width="390" height="844" rx="26" fill="#FFFFFF"/><text x="20" y="24" fill="#5F6B78" font-size="12" font-weight="500" text-anchor="start"><tspan x="20" dy="0">9:41   ·   Android</tspan></text><text x="20" y="71" fill="#191F28" font-size="23" font-weight="700" text-anchor="start"><tspan x="20" dy="0">‹  다운로드(휴대폰 저장)</tspan></text><text x="20" y="136" fill="#191F28" font-size="24" font-weight="700" text-anchor="start"><tspan x="20" dy="0">현재 기록 화면에서 저장</tspan></text><text x="20" y="208" fill="#5F6B78" font-size="14" font-weight="500" text-anchor="start"><tspan x="20" dy="0">별도 페이지·재확인 버튼 없음</tspan></text><rect x="20" y="250" width="350" height="56" rx="12" fill="#FFFFFF" stroke="#DCE1E6"/><text x="34" y="282.8" fill="#191F28" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">저장 준비 → 다운로드 → 기기 쓰기</tspan></text><rect x="20" y="316" width="350" height="64" rx="12" fill="#FDEDEB"/><text x="34" y="352.8" fill="#B8433F" font-size="16" font-weight="500" text-anchor="start"><tspan x="34" dy="0">사진이 휴대폰에 저장되었습니다.</tspan></text><rect x="20" y="390" width="350" height="56" rx="12" fill="#FFFFFF" stroke="#DCE1E6"/><text x="195.0" y="422.8" fill="#B8433F" font-size="16" font-weight="700" text-anchor="middle"><tspan x="195.0" dy="0">부분 실패 시 실패 파일만 재시도</tspan></text><rect x="143" y="826" width="104" height="4" rx="2" fill="#191F28"/></svg>