  </head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex justify-center"><div class="w-full max-w-[390px] min-h-screen relative flex flex-col bg-surface shadow-[0_4px_24px_rgba(22,28,37,0.04)]"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe px-margin bg-surface"><div class="flex flex-col w-full pb-6">
<!-- Top Navigation Bar -->
<header class="w-full flex items-center justify-between h-12 mb-3">
<button aria-label="뒤로가기" class="w-12 h-12 -ml-2.5 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high/60">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
<span class="font-label-sm text-label-sm text-secondary">가입 단계 1/2</span>
</div>
</header>
<!-- Title & Subtitle Section -->
<div class="flex flex-col mb-6">
<div class="flex items-center gap-2 mb-1.5">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">처음 오셨네요</h1>
<span class="inline-flex items-center justify-center text-xl select-none animate-bounce" style="animation-duration: 2s;">👋</span>
</div>
<p class="font-body-md text-body-md text-secondary">문서를 읽고 필요한 항목에 동의해 주세요.</p>
</div>
<!-- Interactive Form Container -->
<form class="flex flex-col gap-6" id="signup-consent-form" onsubmit="event.preventDefault();">
<!-- All Agreement Quick Selector (Moment of Delight) -->
<div class="bg-surface-container-low rounded-[18px] p-4 flex items-center justify-between shadow-sm cursor-pointer select-none transition-all active:scale-[0.99]" id="toggle-all-box">
<div class="flex items-center gap-3">
<div class="w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center transition-colors" id="select-all-icon">
<span class="material-symbols-outlined text-[16px] text-secondary">done_all</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">약관 전체 동의</span>
<span class="font-label-sm text-label-sm text-secondary">선택 동의 항목까지 한 번에 완료해요</span>
</div>
</div>
<span class="material-symbols-outlined text-secondary text-[20px]" id="select-all-chevron">expand_more</span>
</div>
<!-- Agreement List Card -->
<div class="bg-surface-container-low rounded-[20px] p-3.5 flex flex-col gap-1 shadow-sm">
<!-- Row 1: 서비스 이용약관 (필수) -->
<div class="flex items-center justify-between p-2.5 rounded-[14px] hover:bg-surface-container transition-colors select-none group">
<label class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer">
<input checked="" class="peer sr-only consent-item consent-required" id="consent-terms" type="checkbox"/>
<div class="w-6 h-6 rounded-full bg-surface-container-highest peer-checked:bg-primary-container flex items-center justify-center transition-all peer-checked:text-on-primary">
<span class="material-symbols-outlined text-[16px] text-white">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface truncate group-hover:text-primary transition-colors">서비스 이용약관</span>
</label>
<div class="flex items-center gap-2 flex-shrink-0">
<span class="px-2 py-0.5 rounded-full bg-secondary-container text-primary-container font-label-sm text-label-sm font-semibold">필수</span>
<button aria-label="서비스 이용약관 상세 보기" class="w-8 h-8 flex items-center justify-center text-secondary hover:text-on-surface rounded-full" type="button">
<span class="material-symbols-outlined text-[20px]">chevron_right</span>
</button>
</div>
</div>
<!-- Row 2: 개인정보 수집 및 이용 동의 (필수) -->
<div class="flex items-center justify-between p-2.5 rounded-[14px] hover:bg-surface-container transition-colors select-none group">
<label class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer">
<input checked="" class="peer sr-only consent-item consent-required" id="consent-privacy" type="checkbox"/>
<div class="w-6 h-6 rounded-full bg-surface-container-highest peer-checked:bg-primary-container flex items-center justify-center transition-all peer-checked:text-on-primary">
<span class="material-symbols-outlined text-[16px] text-white">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface truncate group-hover:text-primary transition-colors">개인정보 수집 및 이용 동의</span>
</label>
<div class="flex items-center gap-2 flex-shrink-0">
<span class="px-2 py-0.5 rounded-full bg-secondary-container text-primary-container font-label-sm text-label-sm font-semibold">필수</span>
<button aria-label="개인정보 수집 및 이용 동의 상세 보기" class="w-8 h-8 flex items-center justify-center text-secondary hover:text-on-surface rounded-full" type="button">
<span class="material-symbols-outlined text-[20px]">chevron_right</span>
</button>
</div>
</div>
<!-- Row 3: 마케팅 정보 수신 동의 (선택) -->
<div class="flex items-center justify-between p-2.5 rounded-[14px] hover:bg-surface-container transition-colors select-none group">
<label class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer">
<input class="peer sr-only consent-item" id="consent-marketing" type="checkbox"/>
<div class="w-6 h-6 rounded-full bg-surface-container-highest peer-checked:bg-primary-container flex items-center justify-center transition-all text-transparent peer-checked:text-on-primary">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface truncate group-hover:text-primary transition-colors">마케팅 정보 수신 동의</span>
</label>
<div class="flex items-center gap-2 flex-shrink-0">
<span class="px-2 py-0.5 rounded-full bg-surface-container-highest text-secondary font-label-sm text-label-sm font-medium">선택</span>
<button aria-label="마케팅 정보 수신 동의 상세 보기" class="w-8 h-8 flex items-center justify-center text-secondary hover:text-on-surface rounded-full" type="button">
<span class="material-symbols-outlined text-[20px]">chevron_right</span>
</button>
</div>
</div>
<!-- Row 4: 위치정보 이용약관 (선택) -->
<div class="flex items-center justify-between p-2.5 rounded-[14px] hover:bg-surface-container transition-colors select-none group">
<label class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer">
<input class="peer sr-only consent-item" id="consent-location" type="checkbox"/>
<div class="w-6 h-6 rounded-full bg-surface-container-highest peer-checked:bg-primary-container flex items-center justify-center transition-all text-transparent peer-checked:text-on-primary">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface truncate group-hover:text-primary transition-colors">위치정보 이용약관</span>
</label>
<div class="flex items-center gap-2 flex-shrink-0">
<span class="px-2 py-0.5 rounded-full bg-surface-container-highest text-secondary font-label-sm text-label-sm font-medium">선택</span>
<button aria-label="위치정보 이용약관 상세 보기" class="w-8 h-8 flex items-center justify-center text-secondary hover:text-on-surface rounded-full" type="button">
<span class="material-symbols-outlined text-[20px]">chevron_right</span>
</button>
</div>
</div>
</div>
<!-- Display Name Section -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<label class="font-label-lg text-label-lg text-on-surface font-semibold flex items-center gap-1.5" for="display-name-input">
          표시명
          <span class="w-1.5 h-1.5 rounded-full bg-primary-container inline-block"></span>
</label>
<span class="font-label-sm text-label-sm text-secondary bg-surface-container px-2 py-0.5 rounded-md">추후 언제든 변경 가능</span>
</div>
<!-- Name Input Field -->
<div class="relative flex items-center w-full">
<input class="w-full h-[52px] px-4 rounded-[14px] bg-surface-container-lowest text-on-surface font-body-lg text-body-lg outline-none shadow-sm focus:shadow-md transition-all placeholder:text-secondary/50 pr-11" id="display-name-input" maxlength="20" placeholder="사용하실 이름을 적어주세요" type="text" value="지민"/>
<button aria-label="이름 지우기" class="absolute right-3 w-7 h-7 rounded-full bg-surface-container-highest flex items-center justify-center text-secondary hover:text-on-surface active:scale-95 transition-all" id="clear-name-btn" type="button">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<!-- Helper & Counter Footnote -->
<div class="flex items-center justify-between px-1">
<span class="font-body-sm text-body-sm text-secondary">중복 표시명도 사용할 수 있어요. 최대 20자</span>
<span class="font-label-sm text-label-sm text-secondary font-medium tracking-tight" id="char-counter">2/20</span>
</div>
</div>
<!-- Delight Tip Banner -->
<div class="flex items-center gap-3 p-3.5 rounded-[16px] bg-surface-container-low shadow-sm">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center flex-shrink-0 text-primary-container">
<span class="material-symbols-outlined text-[18px]">group</span>
</div>
<p class="font-body-sm text-body-sm text-secondary leading-snug">
        친구들과의 약속 캘린더에서 <span class="font-semibold text-on-surface">가장 친근한 별칭</span>으로 함께해보세요!
      </p>
</div>
<!-- Bottom Action Space Buffer -->
<div class="h-20 w-full"></div>
<!-- Sticky Bottom CTA Bar -->
<div class="fixed bottom-0 left-0 right-0 max-w-[390px] mx-auto px-margin pb-safe pt-3 bg-gradient-to-t from-surface via-surface/95 to-transparent z-20">
<button class="w-full h-[56px] rounded-[14px] bg-primary-container active:bg-on-tertiary-container hover:bg-primary text-on-primary font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 shadow-[0_4px_14px_rgba(241,112,107,0.35)] active:scale-[0.99] transition-all disabled:opacity-40 disabled:pointer-events-none disabled:shadow-none" id="submit-cta" type="button">
<span>동의하고 시작하기</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<script>
  (() => {
    const input = document.getElementById('display-name-input');
    const counter = document.getElementById('char-counter');
    const clearBtn = document.getElementById('clear-name-btn');
    const cta = document.getElementById('submit-cta');
    const requiredCheckboxes = document.querySelectorAll('.consent-required');
    const allCheckboxes = document.querySelectorAll('.consent-item');
    const toggleAllBox = document.getElementById('toggle-all-box');
    const selectAllIcon = document.getElementById('select-all-icon');

    function updateFormState() {
      const val = input.value.trim();
      const len = input.value.length;
      counter.textContent = `${len}/20`;
      
      clearBtn.style.visibility = len > 0 ? 'visible' : 'hidden';

      const allRequiredChecked = Array.from(requiredCheckboxes).every(cb => cb.checked);
      const isNameValid = val.length >= 1 && val.length <= 20;

      if (allRequiredChecked && isNameValid) {
        cta.removeAttribute('disabled');
      } else {
        cta.setAttribute('disabled', 'true');
      }

      // Check all state indicator
      const allChecked = Array.from(allCheckboxes).every(cb => cb.checked);
      if (allChecked) {
        selectAllIcon.classList.remove('bg-surface-container-highest', 'text-secondary');
        selectAllIcon.classList.add('bg-primary-container', 'text-white');
        selectAllIcon.innerHTML = '<span class="material-symbols-outlined text-[16px] text-white">check</span>';
      } else {
        selectAllIcon.classList.remove('bg-primary-container', 'text-white');
        selectAllIcon.classList.add('bg-surface-container-highest', 'text-secondary');
        selectAllIcon.innerHTML = '<span class="material-symbols-outlined text-[16px] text-secondary">done_all</span>';
      }
    }

    input.addEventListener('input', updateFormState);

    clearBtn.addEventListener('click', () => {
      input.value = '';
      input.focus();
      updateFormState();
    });

    allCheckboxes.forEach(cb => {
      cb.addEventListener('change', updateFormState);
    });

    toggleAllBox.addEventListener('click', () => {
      const allCurrentlyChecked = Array.from(allCheckboxes).every(cb => cb.checked);
      allCheckboxes.forEach(cb => {
        cb.checked = !allCurrentlyChecked;
      });
      updateFormState();
    });

    cta.addEventListener('click', () => {
      cta.innerHTML = '<span class="material-symbols-outlined animate-spin text-[22px]">progress_activity</span>';
      setTimeout(() => {
        cta.innerHTML = '<span>환영합니다!</span><span class="material-symbols-outlined text-[20px]">check_circle</span>';
      }, 700);
    });

    updateFormState();
  })();
</script></main></div></body></html>
