<span class="absolute top-1 right-2 flex h-3.5 w-3.5">

<span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-primary"></span>
</span>

        Shared Memory Space
      </span>

<h1 class="font-headline-lg text-headline-lg font-bold text-on-surface mb-3 tracking-tight whitespace-pre-line">
      함께한 순간을
한곳에 모아요
    </h1>
<!-- Subtitle description -->
<p class="font-body-md text-body-md text-secondary max-w-[280px]">
      모임의 일정별로 사진과 영상을 함께 보관해요.
    </p>
<!-- Invite Support Notice Banner -->
<div class="w-full mt-7 px-1">
<div class="w-full bg-secondary-container/70 rounded-xl px-4 py-3.5 flex items-center gap-3 shadow-sm text-left">
<div class="w-8 h-8 rounded-full bg-surface-container-lowest flex items-center justify-center shrink-0 text-primary shadow-xs">
<span class="material-symbols-outlined text-[19px]">mark_email_unread</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface font-medium leading-snug">
          초대받은 모임에 참여하려면 로그인해 주세요.
        </p>
</div>
</div>
</div>
<!-- Dynamic Feedback Banner (Hidden by default, ready for toggle) -->
<div class="w-full mt-6 px-1 hidden" id="auth-error-banner" role="alert">

<span class="font-body-sm text-body-sm font-medium" id="auth-error-text">로그인 중 오류가 발생했습니다. 다시 시도해 주세요.</span>
</div>
</div>
<!-- Actions Area -->
<div class="flex flex-col w-full gap-3 mt-10">
<!-- Kakao Login Button -->
<button aria-label="카카오 계정으로 로그인" class="w-full h-14 bg-[#FEE500] text-[#191600] rounded-[14px] font-label-lg text-label-lg font-semibold flex items-center justify-center relative active:scale-[0.98] transition-transform duration-150 shadow-sm focus:outline-none" id="kakao-login-btn" type="button">
<div class="absolute left-5 flex items-center justify-center">
<!-- Kakao Official Chat Bubble Icon -->
<svg aria-hidden="true" fill="none" height="20" viewbox="0 0 22 20" width="22" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M11 0C4.925 0 0 3.86 0 8.623C0 11.605 1.954 14.225 4.939 15.688L3.935 19.385C3.843 19.721 4.223 19.988 4.516 19.794L8.91 16.883C9.59 16.974 10.287 17.022 11 17.022C17.075 17.022 22 13.162 22 8.623C22 3.86 17.075 0 11 0Z" fill="#000000" fill-rule="evenodd"></path>
</svg>

<span class="font-medium">카카오로 시작하기</span>

<!-- Google Login Button -->
<button aria-label="Google 계정으로 로그인" class="w-full h-14 bg-surface-container-lowest text-on-surface rounded-[14px] font-label-lg text-label-lg font-medium flex items-center justify-center relative shadow-sm active:scale-[0.98] transition-transform duration-150 focus:outline-none" id="google-login-btn" type="button">
<div class="absolute left-5 flex items-center justify-center">
<!-- Google Multicolor Vector Mark -->
<svg aria-hidden="true" height="22" viewbox="0 0 24 24" width="22">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.36 24 12 24Z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27 0-.78.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 10.02 0 12c0 1.98.45 3.84 1.25 5.42l4.03-3.15Z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z" fill="#EA4335"></path>
</svg>
</div>
<span class="font-medium">Google로 시작하기</span>
</button>
<!-- Footer Agreement Links -->
<div class="mt-4 text-center">
<p class="font-body-sm text-body-sm text-secondary">
        시작 시 
        <a class="underline hover:text-on-surface transition-colors cursor-pointer" href="#terms">이용약관</a> 
        및 
        <a class="underline hover:text-on-surface transition-colors cursor-pointer" href="#privacy">개인정보처리방침</a>에 동의하게 됩니다.
      </p>
</div>
</div>
</div>
<script>
  (function() {
    const kakaoBtn = document.getElementById('kakao-login-btn');
    const googleBtn = document.getElementById('google-login-btn');
    const errorBanner = document.getElementById('auth-error-banner');
    const errorText = document.getElementById('auth-error-text');

    function simulateLogin(provider) {
      // Micro tactile indication
      if (errorBanner) {
        errorBanner.classList.add('hidden');
      }

      const originalText = provider === 'kakao' ? '카카오로 시작하기' : 'Google로 시작하기';
      const button = provider === 'kakao' ? kakaoBtn : googleBtn;
      const labelSpan = button.querySelector('span');

      labelSpan.textContent = '연결하는 중...';
      button.style.opacity = '0.85';
      button.disabled = true;

      setTimeout(() => {
        labelSpan.textContent = originalText;
        button.style.opacity = '1';
        button.disabled = false;
      }, 1200);
    }

    if (kakaoBtn) {
      kakaoBtn.addEventListener('click', () => simulateLogin('kakao'));
    }

    if (googleBtn) {
      googleBtn.addEventListener('click', () => simulateLogin('google'));
    }
  })();
</script></main></div></body></html>
