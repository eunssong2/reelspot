  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Back" class="w-11 h-11 -ml-space-sm flex items-center justify-center rounded-full text-on-surface hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="text-headline-sm font-headline-sm text-on-surface">Create Gathering</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-safe bg-surface"><div class="flex flex-col w-full">
<div class="px-margin pt-space-md pb-space-xl flex flex-col gap-space-xl">
<!-- Warm Editorial Intro / Delightful Hook -->
<div class="flex items-center gap-space-md bg-surface-container-low p-space-md rounded-xl">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center shrink-0 text-primary">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">celebration</span>
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface">함께할 순간을 시작해볼까요?</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">모임을 열고 첫 일정을 가볍게 등록해보세요.</span>
</div>
</div>
<!-- Section 1: 모임 이름 -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-1" for="group-name-input">
          모임 이름 <span class="text-primary font-bold">*</span>
</label>
<span class="font-label-sm text-label-sm text-on-surface-variant">어떤 이름이든 좋아요</span>
</div>
<div class="relative flex flex-col mt-1">
<input class="w-full h-12 px-space-md rounded-xl bg-surface-container-lowest text-on-surface font-body-lg text-body-lg shadow-sm placeholder:text-outline focus:outline-none focus:bg-surface-bright transition-all" id="group-name-input" maxlength="50" placeholder="예: 주말 산책 모임" type="text" value="주말 산책 모임"/>
<div class="flex justify-end mt-1 px-1">
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium" id="group-name-count">7/50</span>
</div>
</div>
</div>
<!-- Section 2: 첫 일정 제목 -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-1" for="schedule-title-input">
          첫 일정 제목 <span class="text-primary font-bold">*</span>
</label>
<span class="font-label-sm text-label-sm text-on-surface-variant">언제든 바꿀 수 있어요</span>
</div>
<div class="relative flex flex-col mt-1">
<input class="w-full h-12 px-space-md rounded-xl bg-surface-container-lowest text-on-surface font-body-lg text-body-lg shadow-sm placeholder:text-outline focus:outline-none focus:bg-surface-bright transition-all" id="schedule-title-input" maxlength="100" placeholder="예: 우리의 서울 여행" type="text" value="우리의 서울 여행"/>
<div class="flex justify-end mt-1 px-1">
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium" id="schedule-title-count">9/100</span>
</div>
</div>
</div>
<!-- Section 3: 일정 기간 -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-1">
          일정 기간 <span class="text-primary font-bold">*</span>
</label>
<!-- Duration Pill Badge -->
<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-primary-fixed text-on-primary-fixed font-label-md text-label-md">
<span class="material-symbols-outlined text-[13px]">date_range</span>
          3일 동안
        </span>
</div>
<!-- Dual Date Box Row -->
<div class="flex items-center gap-space-sm mt-1">
<!-- Start Date Box -->
<button class="flex-1 min-h-[56px] px-3.5 py-2.5 rounded-xl bg-surface-container-lowest shadow-sm flex flex-col justify-center items-start text-left active:bg-surface-container-high transition-colors" id="btn-start-date" type="button">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-0.5">시작 날짜</span>
<div class="flex items-center justify-between w-full">
<span class="font-headline-sm text-headline-sm text-on-surface">2026.10.17</span>
<span class="material-symbols-outlined text-primary text-[20px] ml-1">calendar_today</span>
</div>
</button>
<!-- Divider Dash -->
<div class="text-outline font-headline-md text-headline-md px-1 select-none">
          —
        </div>
<!-- End Date Box -->
<button class="flex-1 min-h-[56px] px-3.5 py-2.5 rounded-xl bg-surface-container-lowest shadow-sm flex flex-col justify-center items-start text-left active:bg-surface-container-high transition-colors" id="btn-end-date" type="button">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-0.5">종료 날짜</span>
<div class="flex items-center justify-between w-full">
<span class="font-headline-sm text-headline-sm text-on-surface">2026.10.19</span>
<span class="material-symbols-outlined text-primary text-[20px] ml-1">calendar_today</span>
</div>
</button>
</div>
</div>
<!-- Section 4: Guidance & Policy Box -->
<div class="flex flex-col gap-2 p-space-md rounded-xl bg-surface-container-low text-on-surface-variant">
<div class="flex items-start gap-2">
<span class="material-symbols-outlined text-[18px] text-primary shrink-0 mt-0.5">info</span>
<p class="font-body-sm text-body-sm leading-relaxed">
          시간은 장소를 추가할 때 입력해요. 반복 설정은 없어요. 필요하면 일정을 더 추가해요.
        </p>
</div>
<div class="flex items-start gap-2">
<span class="material-symbols-outlined text-[18px] text-secondary shrink-0 mt-0.5">groups</span>
<p class="font-body-sm text-body-sm leading-relaxed text-secondary font-medium">
          한국 시간 기준 · 최대 10명 고정 · 정원 변경 없음
        </p>
</div>
</div>
<!-- Visual Breathing Gap for Native Scroller -->
<div class="h-16"></div>
</div>
<!-- Section 5: Fixed Bottom Sticky Action Bar -->
<div class="sticky bottom-0 w-full px-margin pb-space-lg pt-space-sm bg-surface/95 backdrop-blur-md">
<button class="w-full min-h-[56px] rounded-xl bg-primary-container text-on-primary font-headline-sm text-headline-sm shadow-md flex items-center justify-center gap-2 active:opacity-90 active:scale-[0.99] transition-all" id="submit-create-group" type="button">
<span>모임과 첫 일정 만들기</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  (function() {
    const nameInput = document.getElementById('group-name-input');
    const nameCount = document.getElementById('group-name-count');
    const titleInput = document.getElementById('schedule-title-input');
    const titleCount = document.getElementById('schedule-title-count');
    const submitBtn = document.getElementById('submit-create-group');

    function updateCount(input, counterEl, max) {
      if (!input || !counterEl) return;
      counterEl.textContent = input.value.length + '/' + max;
    }

    if (nameInput && nameCount) {
      nameInput.addEventListener('input', () => updateCount(nameInput, nameCount, 50));
    }

    if (titleInput && titleCount) {
      titleInput.addEventListener('input', () => updateCount(titleInput, titleCount, 100));
    }

    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        submitBtn.classList.add('scale-95');
        setTimeout(() => submitBtn.classList.remove('scale-95'), 150);
      });
    }
  })();
</script></main></body></html>
